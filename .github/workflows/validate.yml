name: Native Xcode build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Foundation static checks (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Parse Swift files without platform typechecking
        shell: bash
        run: |
          set -euo pipefail
          find . -name '*.swift' -print0 | while IFS= read -r -d '' path; do
            swiftc -frontend -parse "$path"
          done
      - name: Validate Apple entitlements using Python plistlib
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          app, extension = [
              plistlib.loads(pathlib.Path(path).read_bytes())
              for path in (
                  "ios/Entitlements/AgentApp.entitlements",
                  "ios/Entitlements/PacketTunnel.entitlements",
              )
          ]
          for target in (app, extension):
              assert "group.com.gavindu.securityagent" in target[
                  "com.apple.security.application-groups"
              ]
              assert "packet-tunnel-provider" in target[
                  "com.apple.developer.networking.networkextension"
              ]
          print("App/extension entitlement invariants OK")
          PY
      - name: Run static and wrapper regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-wireguard-go.sh
          bash -n scripts/verify-foundation-pins.sh
          bash -n Tests/build/bridge-wrapper-tests.sh
          bash -n Tests/build/pin-validation-tests.sh
          bash scripts/verify-foundation-pins.sh
          bash Tests/build/pin-validation-tests.sh
          bash Tests/build/bridge-wrapper-tests.sh

  native-ios:
    name: Tuist + iOS device and simulator XCTest
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: jdx/mise-action@v3
        with:
          install: true
      - name: Verify pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          tuist version
          go version
          test "$(go version | awk '{print $3}')" = "go1.19.13"
      - name: Resolve packages and generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          test -d SecurityAgent.xcodeproj
      - name: Compile and link iOS app + PacketTunnel (device SDK, no signing)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SecurityAgent.xcodeproj -scheme AgentApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Run deterministic iOS XCTest on simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SecurityAgent.xcodeproj -scheme AgentApp \
            -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Record toolchain and phase outcomes
        if: always()
        shell: bash
        run: |
          {
            echo "# Native build"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "Go: $(go version)"
            echo "Tuist: $(tuist version)"
            echo "Checks are recorded in the Actions job results; this file has no secret material."
          } > "$RUNNER_TEMP/native-summary.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-summary
          path: ${{ runner.temp }}/native-summary.md
          retention-days: 7

  native-mac:
    name: Tuist + macOS companion build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - uses: jdx/mise-action@v3
        with:
          install: true
      - name: Generate project from clean source
        shell: bash
        run: |
          set -euo pipefail
          tuist install
          tuist generate --no-open
          test -d SecurityAgent.xcodeproj
          xcodebuild -list -project SecurityAgent.xcodeproj
      - name: Compile macOS pairing companion without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project SecurityAgent.xcodeproj -scheme AgentMac \
            -configuration Debug -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
